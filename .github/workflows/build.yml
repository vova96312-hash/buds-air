name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for project files
        run: test -f package.json || { echo "package.json not uploaded yet"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Add Android
        run: |
          npx cap add android
          python3 scripts/patch_android.py

      - name: Make icon sources
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 scripts/make_icons.py

      - name: Icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#05050b' --iconBackgroundColorDark '#05050b' --splashBackgroundColor '#05050b' --splashBackgroundColorDark '#05050b'

      - name: Sync
        run: npx cap sync android

      - name: Build
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Buds-Air.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Buds-Air
          path: Buds-Air.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Buds Air build ${{ github.run_number }}
          files: Buds-Air.apk
